services:
  # Python FastAPI Backend
  - type: web
    name: verijob-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python -m backend.app.ml.train"
    startCommand: "python backend/run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ALLOWED_ORIGINS
        value: "https://verijob-frontend.onrender.com,http://localhost:5173"
      - key: PORT
        value: "8000"
    healthCheckPath: /api/health

  # React Vite Frontend Static Site
  - type: web
    name: verijob-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: verijob-backend
          property: host
